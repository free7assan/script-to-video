<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="roundedCard">
      <rect x="40" y="320" width="460" height="340" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="540" height="960" fill="url(#bgGlow)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="540" y2="80"/>
    <line x1="0" y1="160" x2="540" y2="160"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
    <line x1="0" y1="320" x2="540" y2="320"/>
    <line x1="0" y1="400" x2="540" y2="400"/>
    <line x1="0" y1="480" x2="540" y2="480"/>
    <line x1="0" y1="560" x2="540" y2="560"/>
    <line x1="0" y1="640" x2="540" y2="640"/>
    <line x1="0" y1="720" x2="540" y2="720"/>
    <line x1="0" y1="800" x2="540" y2="800"/>
    <line x1="0" y1="880" x2="540" y2="880"/>
    <line x1="60" y1="0" x2="60" y2="960"/>
    <line x1="120" y1="0" x2="120" y2="960"/>
    <line x1="180" y1="0" x2="180" y2="960"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="300" y1="0" x2="300" y2="960"/>
    <line x1="360" y1="0" x2="360" y2="960"/>
    <line x1="420" y1="0" x2="420" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
  </g>

  <!-- Ambient orange glow -->
  <ellipse cx="270" cy="500" rx="250" ry="300" fill="#f97316" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="540" height="2" fill="url(#lineFade)"/>

  <!-- Logo area -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#orangeGrad)"/>
    <text x="16" y="21" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">G</text>
    <text x="42" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="1">GoScript</text>
  </g>

  <!-- Main headline -->
  <text x="270" y="150" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
    <tspan x="270" dy="0">Reverse-engineer any</tspan>
    <tspan x="270" dy="36">YouTuber's script formula</tspan>
  </text>

  <!-- Subheadline -->
  <text x="270" y="225" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="400" font-size="14" letter-spacing="0.2">
    <tspan x="270" dy="0">Paste any channel URL → Get a complete breakdown</tspan>
    <tspan x="270" dy="22">of their hooks, transitions, CTAs &amp; structure</tspan>
  </text>

  <!-- Blueprint Card Mockup -->
  <g>
    <!-- Card background -->
    <rect x="40" y="290" width="460" height="340" rx="16" fill="#141415" stroke="url(#cardBorder)" stroke-width="1"/>
    
    <!-- Card header -->
    <rect x="40" y="290" width="460" height="48" rx="16" fill="#1c1c1e"/>
    <rect x="40" y="322" width="460" height="16" fill="#1c1c1e"/>
    
    <!-- Channel info -->
    <circle cx="70" cy="314" r="14" fill="#f97316" opacity="0.15"/>
    <text x="70" y="319" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-weight="700" font-size="12">M</text>
    <text x="94" y="310" fill="#e4e4e7" font-family="system-ui, sans-serif" font-weight="600" font-size="12">MrBeast-style Analysis</text>
    <text x="94" y="324" fill="#71717a" font-family="system-ui, sans-serif" font-weight="400" font-size="9">Blueprint v2.3 · 47 videos analyzed</text>

    <line x1="60" y1="346" x2="480" y2="346" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Blueprint sections -->
    <!-- Section 1: Hook Patterns -->
    <g transform="translate(60, 360)">
      <rect x="0" y="0" width="420" height="52" rx="8" fill="#ffffff" fill-opacity="0.03"/>
      <text x="16" y="20" fill="#f97316" font-family="system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="0.5">HOOK PATTERNS</text>
      <text x="16" y="38" fill="#d4d4d8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">3 patterns found: Shock value, Curiosity gap, Narrative hook</text>
      <polygon points="406,16 406,36 424,26" fill="#f97316" fill-opacity="0.5"/>
    </g>

    <g transform="translate(60, 422)">
      <rect x="0" y="0" width="420" height="52" rx="8" fill="#ffffff" fill-opacity="0.03"/>
      <text x="16" y="20" fill="#f97316" font-family="system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="0.5">BODY STRUCTURE</text>
      <text x="16" y="38" fill="#d4d4d8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">Archetype: "The Rollercoaster" — escalation + payoff</text>
      <polygon points="406,16 406,36 424,26" fill="#f97316" fill-opacity="0.5"/>
    </g>

    <g transform="translate(60, 484)">
      <rect x="0" y="0" width="420" height="52" rx="8" fill="#ffffff" fill-opacity="0.03"/>
      <text x="16" y="20" fill="#f97316" font-family="system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="0.5">CTA STYLE</text>
      <text x="16" y="38" fill="#d4d4d8" font-family="system-ui, sans-serif" font-weight="500" font-size="10">Direct: "Subscribe or I'll...", "Click the link in bio"</text>
      <polygon points="406,16 406,36 424,26" fill="#f97316" fill-opacity="0.5"/>
    </g>

    <!-- Loading shimmer for section 4 -->
    <g transform="translate(60, 546)">
      <rect x="0" y="0" width="420" height="52" rx="8" fill="#ffffff" fill-opacity="0.02"/>
      <rect x="16" y="16" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="16" y="30" width="280" height="6" rx="3" fill="#ffffff" fill-opacity="0.04"/>
    </g>

    <!-- Bottom highlight bar -->
    <rect x="40" y="618" width="460" height="12" rx="6" fill="#f97316" fill-opacity="0.08"/>
    <rect x="40" y="618" width="180" height="12" rx="6" fill="url(#orangeGrad)" opacity="0.6"/>
  </g>

  <!-- Arrow / transition indicator -->
  <g transform="translate(270, 660)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
    <polygon points="36,-5 44,0 36,5" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Then generates your script -->
  <text x="270" y="710" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="-0.3">
    Then generates your script using those patterns
  </text>
  <text x="270" y="734" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-weight="400" font-size="12">
    Hook → Body → CTA — all written for you
  </text>

  <!-- CTA Button -->
  <g transform="translate(170, 780)">
    <rect x="0" y="0" width="200" height="52" rx="26" fill="url(#ctaGrad)" filter="url(#glow)"/>
    <text x="100" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="15" letter-spacing="0.5">Try GoScript Free →</text>
  </g>

  <!-- Trust line -->
  <text x="270" y="860" text-anchor="middle" fill="#52525b" font-family="system-ui, sans-serif" font-weight="400" font-size="10" letter-spacing="0.3">
    No credit card required · 5 channels free · 5 scripts free
  </text>

  <!-- Bottom decoration -->
  <rect x="220" y="910" width="100" height="3" rx="1.5" fill="#f97316" opacity="0.3"/>
  <rect x="245" y="930" width="50" height="2" rx="1" fill="#ffffff" opacity="0.05"/>

  <!-- Floating decorative elements -->
  <g opacity="0.15">
    <rect x="30" y="420" width="6" height="6" rx="1" fill="#f97316" transform="rotate(45, 33, 423)"/>
    <rect x="504" y="520" width="6" height="6" rx="1" fill="#f97316" transform="rotate(45, 507, 523)"/>
    <rect x="50" y="720" width="4" height="4" rx="1" fill="#f97316" transform="rotate(45, 52, 722)"/>
    <rect x="486" y="380" width="4" height="4" rx="1" fill="#f97316" transform="rotate(45, 488, 382)"/>
  </g>
</svg>
