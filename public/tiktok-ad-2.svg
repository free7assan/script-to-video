<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#151518"/>
      <stop offset="100%" stop-color="#080809"/>
    </radialGradient>
    <linearGradient id="orangeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
    <linearGradient id="progressFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="540" height="960" fill="url(#bg)"/>
  <ellipse cx="270" cy="350" rx="280" ry="320" fill="#f97316" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="540" height="2" fill="url(#orangeLine)"/>

  <!-- Logo -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="30" height="30" rx="7" fill="url(#cta)"/>
    <text x="15" y="20" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="15">G</text>
    <text x="40" y="21" fill="#fff" font-family="system-ui,sans-serif" font-weight="600" font-size="13" letter-spacing="0.8">GoScript</text>
  </g>

  <!-- Large timer display -->
  <g transform="translate(170, 95)">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#f97316" stroke-opacity="0.1" stroke-width="4"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#progressFill)" stroke-opacity="0.6" stroke-width="4"
      stroke-dasharray="597" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(-90, 100, 100)"/>
    <text x="100" y="88" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="40" letter-spacing="-1">5:00</text>
    <text x="100" y="118" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12" letter-spacing="1">AVG. SCRIPT TIME</text>
  </g>

  <!-- Headline -->
  <text x="270" y="250" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
    <tspan x="270" dy="0">From channel analysis</tspan>
    <tspan x="270" dy="36">to finished script</tspan>
    <tspan x="270" dy="36" fill="#f97316">in 5 minutes</tspan>
  </text>

  <!-- Pipeline steps -->
  <g transform="translate(60, 340)">
    <!-- Step 1: Add channel -->
    <rect x="0" y="0" width="420" height="44" rx="10" fill="url(#stepBg)" stroke="#f97316" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="14" y="12" width="20" height="20" rx="5" fill="#f97316" opacity="0.15"/>
    <text x="24" y="26" text-anchor="middle" fill="#f97316" font-family="system-ui,sans-serif" font-weight="700" font-size="11">1</text>
    <text x="48" y="28" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Paste YouTube channel URL</text>
    <text x="410" y="28" text-anchor="end" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">10s</text>

    <!-- Connector -->
    <line x1="24" y1="52" x2="24" y2="68" stroke="#f97316" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Step 2: Blueprint -->
    <rect x="0" y="72" width="420" height="44" rx="10" fill="url(#stepBg)" stroke="#f97316" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="14" y="84" width="20" height="20" rx="5" fill="#f97316" opacity="0.15"/>
    <text x="24" y="98" text-anchor="middle" fill="#f97316" font-family="system-ui,sans-serif" font-weight="700" font-size="11">2</text>
    <text x="48" y="100" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Blueprint generated (hooks, structure, CTAs)</text>
    <text x="410" y="100" text-anchor="end" fill="#52525b" font-family="system-ui,sans-serif" font-size="10">45s</text>

    <!-- Connector -->
    <line x1="24" y1="124" x2="24" y2="140" stroke="#f97316" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Step 3: Generate script -->
    <rect x="0" y="144" width="420" height="44" rx="10" fill="url(#stepBg)" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="14" y="156" width="20" height="20" rx="5" fill="url(#cta)"/>
    <text x="24" y="170" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="11">3</text>
    <text x="48" y="172" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Generate complete script → Ready to film</text>
    <text x="410" y="172" text-anchor="end" fill="#f97316" font-family="system-ui,sans-serif" font-size="10" font-weight="600">60s</text>
  </g>

  <!-- Result highlight bar -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="420" height="56" rx="12" fill="#f97316" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.2" stroke-width="1"/>
    <text x="210" y="24" text-anchor="middle" fill="#f97316" font-family="system-ui,sans-serif" font-weight="600" font-size="14">Total: ~2 min to generate</text>
    <text x="210" y="44" text-anchor="middle" fill="#71717a" font-family="system-ui,sans-serif" font-size="11">vs 2-4 hours writing from scratch</text>
  </g>

  <!-- CTA -->
  <g transform="translate(160, 640)">
    <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#cta)" filter="url(#glow)"/>
    <text x="110" y="32" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="600" font-size="15" letter-spacing="0.4">Try GoScript Free →</text>
  </g>
  <text x="270" y="720" text-anchor="middle" fill="#52525b" font-family="system-ui,sans-serif" font-size="10" letter-spacing="0.3">No credit card · 5 channels free</text>

  <!-- Bottom: script snippet preview -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="420" height="110" rx="12" fill="#111112" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>
    <rect x="0" y="0" width="420" height="30" rx="12" fill="#1a1a1c"/>
    <rect x="0" y="18" width="420" height="12" fill="#1a1a1c"/>
    <circle cx="20" cy="15" r="4" fill="#f97316" opacity="0.3"/>
    <text x="36" y="19" fill="#52525b" font-family="monospace" font-size="9">script-draft-2026-07-11.md</text>

    <text x="16" y="52" fill="#f97316" font-family="monospace" font-size="10" opacity="0.7">## Hook</text>
    <text x="16" y="70" fill="#71717a" font-family="monospace" font-size="10">"Most creators spend 3 hours on scripts.</text>
    <text x="16" y="86" fill="#71717a" font-family="monospace" font-size="10"> I do it in 5 minutes. Here's how."</text>
    <text x="16" y="102" fill="#52525b" font-family="monospace" font-size="9">[Generated by GoScript — 47 lines]</text>
    <rect x="370" y="100" width="36" height="6" rx="3" fill="#f97316" opacity="0.2"/>
  </g>

  <!-- Decorative -->
  <g opacity="0.1">
    <rect x="30" y="300" width="5" height="5" rx="1" fill="#f97316" transform="rotate(45,32,302)"/>
    <rect x="505" y="600" width="5" height="5" rx="1" fill="#f97316" transform="rotate(45,507,602)"/>
  </g>
</svg>
